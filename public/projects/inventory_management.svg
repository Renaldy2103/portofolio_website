<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#05080e"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bfff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="cyanBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowInv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGradInv)"/>

  <!-- Architecture Blueprint Grid -->
  <g stroke="#00bfff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="880" cy="337" r="340" fill="url(#cyanBloom)"/>

  <!-- Left Content: Typography & Details -->
  <g transform="translate(100, 130)">
    <!-- Category & Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="210" height="34" rx="17" fill="#00bfff" fill-opacity="0.12" stroke="#00bfff" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4.5" fill="#f59e0b"/>
      <text x="34" y="22" fill="#00bfff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2">BACKEND &amp; FULL-STACK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="0.5">Inventory Management</text>
    <text x="0" y="145" fill="#00bfff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="1">System 📦</text>
    
    <!-- Tagline -->
    <text x="0" y="195" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">Enterprise Concurrency, Audit Trails &amp; RBAC Architecture</text>

    <!-- Key Engineering Highlights -->
    <text x="0" y="245" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" dy="0">• Stock Concurrency Safety: Atomic Transactions &amp; Row-Level Locks</tspan>
      <tspan x="0" dy="28">• Clean Layered Architecture: Router → Dependencies → Service → Repository</tspan>
      <tspan x="0" dy="28">• Complete Transaction Audit Trail &amp; Role-Based Access Control</tspan>
    </text>

    <!-- Technology Badges -->
    <g transform="translate(0, 345)">
      <!-- Python -->
      <g transform="translate(0, 0)">
        <rect width="105" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="52" y="23" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">PYTHON</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(117, 0)">
        <rect width="105" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="52" y="23" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">FASTAPI</text>
      </g>
      <!-- PostgreSQL -->
      <g transform="translate(234, 0)">
        <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="67" y="23" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700">POSTGRESQL</text>
      </g>
      <!-- SQLAlchemy -->
      <g transform="translate(381, 0)">
        <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="72" y="23" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="700">SQLALCHEMY 2.X</text>
      </g>
      <!-- Docker -->
      <g transform="translate(538, 0)">
        <rect width="100" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="50" y="23" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">DOCKER</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Backend Architecture Pipeline Diagram -->
  <g transform="translate(740, 160)">
    <!-- Container Box -->
    <rect x="0" y="0" width="370" height="370" rx="20" fill="#0b111e" stroke="#1e293b" stroke-width="1.5" filter="url(#glowInv)"/>

    <!-- Architecture Header -->
    <rect x="0" y="0" width="370" height="42" rx="20" fill="#131d2e"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="59" cy="21" r="5" fill="#10b981"/>
    <text x="185" y="26" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="700">LAYERED ARCHITECTURE</text>

    <!-- Node 1: Router & Schema -->
    <g transform="translate(30, 60)">
      <rect width="310" height="50" rx="10" fill="#141f33" stroke="#00bfff" stroke-width="1.5"/>
      <text x="20" y="31" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">API ROUTER (FastAPI)</text>
      <rect x="210" y="12" width="85" height="26" rx="6" fill="#00bfff" fill-opacity="0.15"/>
      <text x="252" y="29" text-anchor="middle" fill="#00bfff" font-family="monospace" font-size="11" font-weight="700">PYDANTIC</text>
    </g>

    <!-- Arrow down 1 -->
    <path d="M185 115 L185 135" stroke="#00bfff" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 2: Service & Concurrency (SELECT FOR UPDATE) -->
    <g transform="translate(30, 140)">
      <rect width="310" height="56" rx="10" fill="#17253d" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="20" y="27" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">SERVICE LAYER</text>
      <text x="20" y="45" fill="#93c5fd" font-family="monospace" font-size="11">SELECT FOR UPDATE • ATOMIC</text>
      <rect x="220" y="15" width="75" height="26" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="257" y="32" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">ACID SAFE</text>
    </g>

    <!-- Arrow down 2 -->
    <path d="M185 200 L185 220" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 3: Repository & SQLAlchemy -->
    <g transform="translate(30, 225)">
      <rect width="310" height="50" rx="10" fill="#141f33" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="31" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="700">REPOSITORY PATTERN</text>
      <rect x="195" y="12" width="100" height="26" rx="6" fill="#6366f1" fill-opacity="0.15"/>
      <text x="245" y="29" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10" font-weight="700">SQLALCHEMY 2.X</text>
    </g>

    <!-- Arrow down 3 -->
    <path d="M185 280 L185 295" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Node 4: Database Cylinder (PostgreSQL) -->
    <g transform="translate(30, 300)">
      <rect width="310" height="50" rx="10" fill="#0f1b2d" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="31" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">POSTGRESQL DB</text>
      <text x="145" y="31" fill="#64748b" font-family="monospace" font-size="11">CHECK (stock &gt;= 0) • AUDIT</text>
    </g>
  </g>
</svg>